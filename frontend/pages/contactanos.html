<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contáctanos - Información de contacto, radicación de PQRSF y ubicación en Google Maps de TMV.">
    <title>Contáctanos - TMV</title>

    <!-- Google Fonts: Patrick Hand & Comic Neue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">

    <!-- Estilos Personalizados en Vanilla CSS -->
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/components/header.css">
    <link rel="stylesheet" href="../styles/components/footer.css">
    <link rel="stylesheet" href="../styles/pages/contact.css">
</head>
<body>

    <!-- ==================== HEADER (Reutilizable) ==================== -->
    <div id="header-container"></div>

    <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
    <main class="main-content py-5">
        <div class="container">
            <h1 class="text-center">Contáctanos</h1>

            <section>
                <h2>Información del Comercio</h2>
                <ul>
                    <li><strong>📞 Teléfono:</strong> +57 (601) 000-0000</li>
                    <li><strong>📍 Dirección:</strong> Calle Principal # 123, Ciudad</li>
                    <li><strong>✉️ Correo:</strong> contacto@tmv.com</li>
                </ul>
            </section>

            <section>
                <h2>Formulario PQRSF</h2>
                <form id="pqrsfForm">
                    <div>
                        <label for="contactName">Nombre Completo</label>
                        <input type="text" id="contactName" placeholder="Tu nombre" required>
                    </div>
                    <div>
                        <label for="contactEmail">Correo Electrónico</label>
                        <input type="email" id="contactEmail" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div>
                        <label for="pqrsfType">Tipo de Solicitud</label>
                        <select id="pqrsfType" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="peticion">Petición</option>
                            <option value="queja">Queja</option>
                            <option value="reclamo">Reclamo</option>
                            <option value="sugerencia">Sugerencia</option>
                            <option value="felicitacion">Felicitación</option>
                        </select>
                    </div>
                    <div>
                        <label for="contactMessage">Mensaje / Detalle de la Solicitud</label>
                        <textarea id="contactMessage" rows="4" placeholder="Describe tu caso detalladamente..." required></textarea>
                    </div>
                    <button type="submit" class="btn-tmv">Enviar Solicitud</button>
                </form>
            </section>

            <section>
                <h2>Nuestra Ubicación</h2>
                <p>Encuéntranos en nuestras oficinas o almacén principal en Bogotá, Colombia.</p>
            </section>
        </div>
    </main>

    <!-- ==================== FOOTER (Reutilizable) ==================== -->
    <div id="footer-container"></div>

    <!-- Scripts de la Aplicación -->
    <script type="module" src="../scripts/main.js"></script>
    <script type="module" src="../scripts/pages/contact.js"></script>
</body>
</html>
