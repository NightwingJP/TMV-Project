<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="¿Nuestro producto? - Catálogo de productos con fotos, descripción y detalles de presentación.">
    <title>¿Nuestro producto? - TMV</title>

    <!-- Google Fonts: Patrick Hand & Comic Neue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/components/header.css">
    <link rel="stylesheet" href="../styles/components/footer.css">
    <link rel="stylesheet" href="../styles/pages/catalog.css">
</head>
<body>

    <!-- ==================== HEADER (Reutilizable) ==================== -->
    <div id="header-container"></div>

    <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
    <main class="main-content py-5">
        <div class="container">
            <h2 class="mb-4 text-center font-weight-bold">Catálogo de Productos</h2>

            <!-- Grid de Productos -->
            <div class="row" id="productGrid">
                <!-- Tarjeta de Producto Modelo -->
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm product-card">
                        <!-- Foto del Producto -->
                        <div class="product-image-container bg-light text-center py-4">
                            <img src="../assets/images/products/product-placeholder.png" class="card-img-top img-fluid px-3" alt="Foto de producto de muestra" onerror="this.src='https://via.placeholder.com/300x200?text=Foto+Producto'">
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title font-weight-bold">Producto de Muestra</h5>
                            <!-- Descripción -->
                            <p class="card-text text-muted mb-2">Descripción detallada de las características y especificaciones del producto.</p>
                            <!-- Detalle de Presentación -->
                            <div class="product-details mt-auto pt-2 border-top">
                                <small class="text-secondary d-block"><strong>Detalle de presentación:</strong> Presentación estándar (ej. Caja x 24 unidades / 500g)</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ==================== FOOTER (Reutilizable) ==================== -->
    <div id="footer-container"></div>

    <!-- Bootstrap 4 Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
    <script type="module" src="../scripts/main.js"></script>
    <script type="module" src="../scripts/pages/catalog.js"></script>
</body>
</html>
