<header class="tmv-header">
    <div class="container tmv-header-container">

        <!-- Bloque de Marca (Izquierda) -->
        <div class="tmv-brand-group">
            <a href="index.html" class="tmv-brand-link" data-path="index.html">
                <span class="tmv-brand-badge">TMV</span>
                <span class="tmv-brand-title">Tu Mayorista Virtual</span>
            </a>
            <div class="tmv-logo-slot">
                <span class="tmv-logo-placeholder">[ IMAGEN LOGO ]</span>
                <img src="assets/images/logos/logo.png" alt="Logo TMV" class="tmv-logo-img"
                    onerror="this.style.display='none';">
            </div>
        </div>

        <!-- Botón Hamburguesa para Móviles -->
        <button class="tmv-nav-toggle" id="tmvNavToggle" type="button" aria-label="Abrir menú de navegación"
            aria-expanded="false">
            <span class="tmv-hamburger-line"></span>
            <span class="tmv-hamburger-line"></span>
            <span class="tmv-hamburger-line"></span>
        </button>

        <!-- Navegación y Acciones -->
        <div class="tmv-nav-wrapper" id="tmvNavWrapper">
            <nav class="tmv-nav" aria-label="Navegación principal">
                <ul class="tmv-nav-list">
                    <li class="tmv-nav-item">
                        <a href="index.html" class="tmv-nav-link" data-path="index.html">INICIO</a>
                    </li>
                    <li class="tmv-nav-item">
                        <a href="pages/quienes-somos.html" class="tmv-nav-link" data-path="quienes-somos.html">QUIÉNES
                            SOMOS</a>
                    </li>
                    <li class="tmv-nav-item">
                        <a href="pages/que-ofrecemos.html" class="tmv-nav-link" data-path="que-ofrecemos.html">QUÉ
                            OFRECEMOS</a>
                    </li>
                    <li class="tmv-nav-item">
                        <a href="pages/productos.html" class="tmv-nav-link" data-path="productos.html">CATÁLOGO</a>
                    </li>
                    <li class="tmv-nav-item">
                        <a href="pages/aliados.html" class="tmv-nav-link" data-path="aliados.html">ALIADO</a>
                    </li>
                    <li class="tmv-nav-item">
                        <a href="pages/contactanos.html" class="tmv-nav-link" data-path="contactanos.html">CONTACTO</a>
                    </li>
                </ul>
            </nav>

            <!-- Acciones a la Derecha (Carrito y Login) -->
            <div class="tmv-actions">
                <a href="#carrito" class="tmv-cart-btn" id="tmvCartBtn" aria-label="Ver carrito de compras">
                    <svg class="tmv-cart-icon" viewBox="0 0 24 24" width="20" height="20" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="tmv-cart-badge" id="tmvCartBadge">[ 0 ]</span>
                </a>

                <a href="#login" class="tmv-auth-btn" id="tmvAuthBtn">
                    [ Iniciar Sesión ]
                </a>
            </div>
        </div>

    </div>
