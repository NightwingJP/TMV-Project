spring.application.name=tmv
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/db_tienda_virtual_mayorista
spring.datasource.username=root
spring.datasource.password=CAMBIAR_CONTRASENA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# La variable jwt.secret se carga desde el archivo .env (no compartir)
jwt.expiration=3600000
admin.email=${ADMIN_EMAIL:admin@tmv.com}
admin.password=${ADMIN_PASSWORD:Admin#2026}